<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Player Lab</title>
<style>body{margin:0;background:#11121a;color:#eee;font:16px system-ui}header{padding:16px 22px;border-bottom:1px solid #454053;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}small{color:#bbb}button,select,a{font:inherit;padding:10px;background:#282333;color:#fff;border:1px solid #897044;border-radius:6px}a{text-decoration:none}main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:16px;height:calc(100vh - 145px)}.pane{min-width:0;display:flex;flex-direction:column;gap:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}iframe{width:100%;height:100%;border:1px solid #655231;border-radius:8px;background:#08080c}#phone{max-width:420px;align-self:center}#identity{font-size:13px;color:#d7be7d}#message{padding:0 22px;color:#d7be7d}@media(max-width:900px){main{grid-template-columns:1fr;height:auto}.tv{height:420px}.phone{height:780px}}body.phone-only main{display:block;height:calc(100vh - 145px)}body.phone-only .tv{display:none}body.phone-only .phone{height:100%;max-width:440px;margin:auto}body.all-players main{display:block;height:auto}body.all-players .tv,body.all-players .phone{display:none}#playerGrid{display:none}body.all-players #playerGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.player-card{min-width:0}.player-card h2{font-size:16px}.player-card iframe{height:720px;box-sizing:border-box}#allActions{display:none}body.all-players #allActions{display:inline-block}details{position:relative}summary{cursor:pointer;padding:10px;border:1px solid #897044;border-radius:6px}details[open]{padding:8px;background:#282333}#windowFallback{display:flex;gap:8px;flex-wrap:wrap}#windowStatus:empty{display:none}</style></head>
<body><header><div><h1>Player Lab</h1><small>Local development · separate test identities · no live game writes</small></div><button id="togglePlayers" aria-pressed="false">All players</button><button id="allActions">Show Actions on all</button><button id="reload">Reload screens</button><button id="resetGame">Reset game</button><button id="advanceStory">Progress story</button><label for="storyStep">Jump to</label><select id="storyStep"></select><button id="jumpStory">Go</button><a id="separateTV" target="_blank">Open TV separately</a><details id="playerWindows"><summary>Open player windows</summary><button id="openSwitcher">One window · switch players</button><button id="openSeparate">Separate player windows</button><p id="windowStatus" role="status"></p><div id="windowFallback"></div></details></header><p id="message" role="status">Loading test session…</p><main><div class="pane tv"><div class="toolbar"><strong>TV / host</strong></div><iframe id="tv" title="Host TV" allow="fullscreen; autoplay"></iframe></div><div class="pane phone"><div class="toolbar"><label for="player">Test as player</label><select id="player"></select></div><div id="identity"></div><iframe id="phone" title="Selected test player" allow="autoplay; camera"></iframe></div><div id="playerGrid"></div></main>
<script>
(async()=>{const config=await(await fetch('/__lab/config')).json();const select=document.getElementById('player'),phone=document.getElementById('phone'),tv=document.getElementById('tv');const params=new URLSearchParams(location.search),fixedPlayer=config.players.find(p=>p.uid===params.get('player'));if(params.has('player')&&!fixedPlayer)throw Error('Unknown test player. Open a window from Player Lab.');if(params.get('view')==='phone')document.body.classList.add('phone-only');
for(const player of config.players){const option=new Option(player.name,player.uid);select.add(option);}select.value=fixedPlayer?.uid||localStorage.getItem('lab-selected-player')||config.players[0].uid;if(fixedPlayer){select.disabled=true;document.title=fixedPlayer.name+' · Player Lab';document.getElementById('togglePlayers').hidden=true;document.getElementById('playerWindows').hidden=true;}if(!select.value)select.selectedIndex=0;
const tvUrl='/estate-tv.html?id='+encodeURIComponent(config.gameId)+'&labPlayer='+encodeURIComponent(config.hostUid);document.getElementById('separateTV').href=tvUrl;
const tabKey=fixedPlayer?'lab-tab-'+fixedPlayer.uid:'lab-current-tab';let selectedTab=localStorage.getItem(tabKey)||'actions';let gridLoaded=false;const grid=document.getElementById('playerGrid');
function openPlayer(){const player=config.players.find(p=>p.uid===select.value);if(!fixedPlayer)localStorage.setItem('lab-selected-player',player.uid);document.getElementById('identity').textContent=player.name+' · ordinary player permissions';phone.src='/authenticated-dashboard.html?labPlayer='+encodeURIComponent(player.uid)+'&labTab='+encodeURIComponent(selectedTab);}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==phone.contentWindow||event.data?.type!=='lab-tab')return;selectedTab=event.data.tab;localStorage.setItem(tabKey,selectedTab);});
function buildGrid(){grid.replaceChildren();for(const player of config.players){const card=document.createElement('div');card.className='player-card';const title=document.createElement('h2');title.textContent=player.name;const frame=document.createElement('iframe');frame.title=player.name+' test phone';frame.allow='autoplay';frame.src='/authenticated-dashboard.html?labPlayer='+encodeURIComponent(player.uid)+'&labTab=actions';card.append(title,frame);grid.append(card);}gridLoaded=true;}
document.getElementById('togglePlayers').onclick=()=>{const active=document.body.classList.toggle('all-players');document.getElementById('togglePlayers').textContent=active?'TV + selected player':'All players';document.getElementById('togglePlayers').setAttribute('aria-pressed',String(active));if(active){phone.src='about:blank';buildGrid();}else{grid.replaceChildren();gridLoaded=false;openPlayer();}};
document.getElementById('allActions').onclick=()=>grid.querySelectorAll('iframe').forEach(frame=>frame.contentWindow.postMessage({type:'lab-show-tab',tab:'actions'},location.origin));
select.onchange=openPlayer;openPlayer();if(!document.body.classList.contains('phone-only'))tv.src=tvUrl;
document.getElementById('reload').onclick=()=>{if(gridLoaded)buildGrid();else openPlayer();if(tv.src)tv.src=tvUrl;};document.getElementById('message').textContent=config.title+' · '+config.players.length+' test players. Each player keeps their own progress when you switch.';

const windowStatus=document.getElementById('windowStatus'),fallback=document.getElementById('windowFallback');
function playerWindow(player){const url=new URL('/',location.origin);url.searchParams.set('view','phone');if(player)url.searchParams.set('player',player.uid);return window.open(url.href,'lab-'+config.gameId+'-'+(player?player.uid:'switcher'),'popup,width=460,height=900,resizable=yes,scrollbars=yes');}
document.getElementById('openSwitcher').onclick=()=>{const opened=playerWindow();windowStatus.textContent=opened?'Player switcher opened.':'Your browser blocked the window. Allow pop-ups for this local site and try again.';};
document.getElementById('openSeparate').textContent='Separate windows · '+config.players.length+' players';
document.getElementById('openSeparate').onclick=()=>{fallback.replaceChildren();let blocked=0;for(const player of config.players){if(!playerWindow(player)){blocked++;const button=document.createElement('button');button.textContent='Open '+player.name;button.onclick=()=>{if(playerWindow(player))button.remove();};fallback.append(button);}}windowStatus.textContent=blocked?blocked+' windows were blocked. Allow pop-ups for this local site and retry, or open the remaining players below.':config.players.length+' player windows opened. Reopening reuses each player’s window.';};
const stepSelect=document.getElementById('storyStep'),message=document.getElementById('message');
for(const [index,step] of (config.steps||[]).entries())stepSelect.add(new Option((index+1)+'. '+step.label,step.id));
let busy=false;
async function status(){if(busy)return;try{const r=await fetch('/__lab/progress');if(!r.ok)return;const state=await r.json();const step=config.steps.find(s=>s.id===state.stepId);document.getElementById('advanceStory').disabled=!step?.next;document.getElementById('advanceStory').textContent='Progress story'+(step?' · '+step.label:'');}catch{}}
async function change(action){
 if(busy)return;
 if(action==='reset'&&!confirm('Reset this local test game? This clears collected clues, inventory, memories, puzzle progress and player progress, and returns to the first story step. Test identities are kept.'))return;
 busy=true;const buttons=['resetGame','advanceStory','jumpStory'].map(id=>document.getElementById(id));buttons.forEach(b=>b.disabled=true);
 try{const r=await fetch('/__lab/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,stepId:stepSelect.value})});if(!r.ok)throw Error(await r.text());const state=await r.json();stepSelect.value=state.stepId;document.getElementById('reload').click();message.textContent=(action==='reset'?'Test game reset. ':'Story moved. ')+(config.steps.find(s=>s.id===state.stepId)?.label||state.stepId);}
 catch(e){message.textContent=e.message;}finally{busy=false;buttons.forEach(b=>b.disabled=false);status();}
}
 document.getElementById('resetGame').onclick=()=>change('reset');document.getElementById('advanceStory').onclick=()=>change('advance');document.getElementById('jumpStory').onclick=()=>change('jump');
 const initial=await(await fetch('/__lab/progress')).json();stepSelect.value=initial.stepId;status();setInterval(status,3000);
})().catch(e=>document.getElementById('message').textContent=e.message);
</script></body></html>
