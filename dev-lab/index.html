<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Player Lab</title>
<style>body{margin:0;background:#11121a;color:#eee;font:16px system-ui}header{padding:16px 22px;border-bottom:1px solid #454053;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}small{color:#bbb}button,select,a{font:inherit;padding:10px;background:#282333;color:#fff;border:1px solid #897044;border-radius:6px}a{text-decoration:none}main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:16px;height:calc(100vh - 145px)}.pane{min-width:0;display:flex;flex-direction:column;gap:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}iframe{width:100%;height:100%;border:1px solid #655231;border-radius:8px;background:#08080c}#phone{max-width:420px;align-self:center}#identity{font-size:13px;color:#d7be7d}#message{padding:0 22px;color:#d7be7d}@media(max-width:900px){main{grid-template-columns:1fr;height:auto}.tv{height:420px}.phone{height:780px}}body.phone-only main{display:block;height:calc(100vh - 145px)}body.phone-only .tv{display:none}body.phone-only .phone{height:100%;max-width:440px;margin:auto}</style></head>
<body><header><div><h1>Player Lab</h1><small>Local development · separate test identities · no live game writes</small></div><button id="reload">Reload screens</button><a id="separateTV" target="_blank">Open TV separately</a><a href="/?view=phone" target="_blank">Open player window</a></header><p id="message" role="status">Loading test session…</p><main><div class="pane tv"><div class="toolbar"><strong>TV / host</strong></div><iframe id="tv" title="Host TV" allow="fullscreen; autoplay"></iframe></div><div class="pane phone"><div class="toolbar"><label for="player">Test as player</label><select id="player"></select></div><div id="identity"></div><iframe id="phone" title="Selected test player" allow="autoplay; camera"></iframe></div></main>
<script>
(async()=>{const config=await(await fetch('/__lab/config')).json();const select=document.getElementById('player'),phone=document.getElementById('phone'),tv=document.getElementById('tv');if(new URLSearchParams(location.search).get('view')==='phone')document.body.classList.add('phone-only');
for(const player of config.players){const option=new Option(player.name,player.uid);select.add(option);}select.value=localStorage.getItem('lab-selected-player')||config.players[0].uid;if(!select.value)select.selectedIndex=0;
const tvUrl='/estate-tv.html?id='+encodeURIComponent(config.gameId)+'&labPlayer='+encodeURIComponent(config.hostUid);document.getElementById('separateTV').href=tvUrl;
function openPlayer(){const player=config.players.find(p=>p.uid===select.value);localStorage.setItem('lab-selected-player',player.uid);document.getElementById('identity').textContent=player.name+' · ordinary player permissions';phone.src='/authenticated-dashboard.html?labPlayer='+encodeURIComponent(player.uid);}
select.onchange=openPlayer;openPlayer();if(!document.body.classList.contains('phone-only'))tv.src=tvUrl;
document.getElementById('reload').onclick=()=>{openPlayer();if(tv.src)tv.src=tvUrl;};document.getElementById('message').textContent=config.title+' · '+config.players.length+' test players. Each player keeps their own progress when you switch.';
})().catch(e=>document.getElementById('message').textContent=e.message);
</script></body></html>
