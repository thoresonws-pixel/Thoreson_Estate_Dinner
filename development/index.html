<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game development</title><style>body{font:18px system-ui;max-width:850px;margin:50px auto;padding:20px;background:#151721;color:#eee}button,input,select,a{font:inherit;margin:6px;padding:12px}a{color:#e8c878}label{display:block}#status{white-space:pre-wrap}article{border:1px solid #777;padding:16px;margin:15px 0}</style></head><body>
<h1>Shared development game</h1><p>Development data only. Your local Player Lab remains the place to simulate all characters.</p>
<button id="login">Sign in with Google</button><button id="logout" hidden>Sign out</button><p id="identity"></p><p id="status" role="status"></p>
<div id="workspace" hidden><label>Story <select id="story"></select></label><label>Session name <input id="name" value="My development test" maxlength="80"></label><button id="create">Create my test game</button><h2>Your sessions</h2><div id="sessions"></div><a href="home.html">Open normal game dashboard / join a teammate’s game</a></div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script><script src="development-config.js"></script><script src="story-package.js"></script><script>
firebase.initializeApp(window.DEVELOPMENT_CONFIG);const auth=firebase.auth(),db=firebase.database();let user,subscription;const $=id=>document.getElementById(id),status=message=>$('status').textContent=message;
$('login').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>status(e.message));$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async value=>{user=value;if(subscription)subscription.off();$('workspace').hidden=true;$('login').hidden=!!user;$('logout').hidden=!user;$('identity').textContent=user?.email||'';if(!user)return;
try{await db.ref('users/'+user.uid).update({email:user.email,displayName:user.displayName||user.email});const catalog=await StoryPackage.catalog();$('story').replaceChildren();for(const id of Object.keys(catalog.stories)){const pack=await StoryPackage.load(id);$('story').add(new Option(pack.metadata.name,id));}$('workspace').hidden=false;status('Keep separate sessions for independent testing. Share a party code only when testing together.');subscription=db.ref('games').orderByChild('createdBy').equalTo(user.uid);subscription.on('value',snap=>{const holder=$('sessions');holder.replaceChildren();for(const [id,g] of Object.entries(snap.val()||{})){const card=document.createElement('article'),title=document.createElement('h3');title.textContent=g.partyName+' · '+g.partyCode;const tv=document.createElement('a');tv.textContent='Open TV';tv.href='estate-tv.html?id='+encodeURIComponent(id);tv.target='_blank';const phone=document.createElement('button');phone.textContent='Open my player';phone.onclick=async()=>{await db.ref('users/'+user.uid+'/currentGameId').set(id);location.href='authenticated-dashboard.html';};card.append(title,tv,phone);holder.append(card);}},e=>status(e.message));}catch(e){status('Access is limited to the development team. Give the project owner this account UID to request access: '+user.uid+'\n'+e.message);}});
$('create').onclick=async()=>{const button=$('create');button.disabled=true;try{const pack=await StoryPackage.load($('story').value);if(!pack.experience)throw Error('This story does not yet have an experience flow.');const [characterId,character]=Object.entries(pack.content.characters)[0],step=pack.experience.steps.find(s=>s.type==='exploration')||pack.experience.steps[0],ref=db.ref('games').push(),code='DEV-'+crypto.randomUUID().slice(0,8).toUpperCase();const game={storyId:pack.id,storyName:pack.metadata.name,partyName:$('name').value.trim()||'Development test',partyCode:code,createdBy:user.uid,createdAt:Date.now(),status:'active',gameMode:'standard',unlockId:'development',players:{[user.uid]:{characterId,characterName:character.name,displayName:user.displayName||user.email,status:'ready',joinedAt:Date.now(),questionnaireComplete:true,waiverSigned:true}},state:{experience:{stepId:step.id,startedAt:Date.now()},tv:{}}};await ref.set(game);await db.ref('partyCodeIndex/'+code).set({gameId:ref.key,storyId:pack.id,storyName:pack.metadata.name,partyName:game.partyName});await db.ref('users/'+user.uid+'/currentGameId').set(ref.key);status('Test game created.');}catch(e){status(e.message);}finally{button.disabled=false;}};
</script></body></html>
