<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thoreson Family Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #c9a227;
    font-family: 'Playfair Display', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
  }
  .crest { width: 220px; max-width: 80vw; margin-bottom: 30px; }
  .found {
    font-size: 28px;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 10px;
    color: #c9a227;
  }
  .sub {
    font-size: 15px;
    color: #8b7355;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .logged {
    font-size: 13px;
    color: #555;
    text-align: center;
    font-style: italic;
    margin-top: 20px;
  }
  .not-logged {
    font-size: 14px;
    color: #8b4a4a;
    text-align: center;
    margin-top: 20px;
  }
  .login-btn {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 28px;
    border: 1px solid #c9a227;
    color: #c9a227;
    text-decoration: none;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .divider {
    width: 60px;
    height: 1px;
    background: #c9a227;
    opacity: 0.3;
    margin: 0 auto 30px;
  }
</style>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="theme-color" content="#c9a227">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ThorsMystery">
<script src="story-memory-reader.js"></script><script src="story-package.js"></script><script src="story-content.js"></script></head>
<body>

<div id="scanArt"></div>

<div class="found">You found a clue.</div>
<div class="sub">Bring this to the group</div>
<div class="divider"></div>

<div id="status" class="logged"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyApHrYubqWrR4m0ihdpq6Ym40jv4HTQ5i0",
    authDomain: "thoreson-estate.firebaseapp.com",
    databaseURL: "https://thoreson-estate-default-rtdb.firebaseio.com",
    projectId: "thoreson-estate",
    storageBucket: "thoreson-estate.firebasestorage.app",
    messagingSenderId: "182924616892",
    appId: "1:182924616892:web:8153e1c69895cee665dcb9"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  (async()=>{try {
    const story=await StoryPackage.fromContext(db);document.title=story.metadata.name;
    document.getElementById('scanArt').innerHTML=story.presentation?.scanPageEmblem||'';
    const scanned=StoryContent.decodeScan(story,location.href);
    const session=JSON.parse(localStorage.getItem('userSession'));
    if(!session?.username||!session.currentGameId){document.getElementById('status').textContent='Sign in to your party to record this scan.';return;}
    const player=session.username,base='games/'+session.currentGameId+'/state/';
    await db.ref(base+'scans/'+player).transaction(n=>(n||0)+1);
    await db.ref(base+'scanLog').push({player,charKey:session.character||player,propId:scanned.id,time:Date.now()});
    document.getElementById('status').textContent='Logged for '+player;
  }catch(error){document.getElementById('status').textContent=error.message;}})();
</script></body></html>
