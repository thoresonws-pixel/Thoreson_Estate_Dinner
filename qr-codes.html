<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Thoreson Estate — QR Codes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f0e8;
      font-family: Georgia, serif;
      padding: 32px;
    }
    h1 {
      text-align: center;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #3a2a10;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #8a7a5a;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      max-width: 960px;
      margin: 0 auto;
      justify-content: center;
    }
    .qr-card {
      border: 1px solid #3a2a10;
      border-radius: 4px;
      overflow: hidden;
      background: #fffdf5;
      break-inside: avoid;
      page-break-inside: avoid;
      width: 180px;
    }
    .section-break {
      break-before: page;
      page-break-before: always;
    }
    .qr-top {
      padding: 12px 12px 8px;
      text-align: center;
    }
    .qr-badge {
      font-size: 8px;
      letter-spacing: 2px;
      font-family: Arial, sans-serif;
      margin-bottom: 4px;
    }
    .qr-number {
      font-size: 28px;
      color: #e8d9b8;
      line-height: 1;
    }
    .qr-number span { font-size: 14px; color: #8a7a5a; }
    .qr-label {
      font-size: 10px;
      color: #8a7a5a;
      font-style: italic;
      margin-top: 4px;
      line-height: 1.3;
    }
    .qr-act {
      font-size: 9px;
      color: #6a5a3a;
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .qr-code {
      display: flex;
      justify-content: center;
      padding: 12px;
      background: #fffdf5;
    }
    .qr-code img, .qr-code canvas { display: block; }
    .qr-url {
      text-align: center;
      font-size: 8px;
      color: #8a7a5a;
      padding: 0 8px 8px;
      font-family: monospace;
      letter-spacing: 0.5px;
      word-break: break-all;
    }
    @media print {
      body { background: white; padding: 16px; }
      .grid { gap: 12px; }
      .qr-card { border-color: #999; break-inside: avoid; page-break-inside: avoid; }
      .section-break { break-before: page; page-break-before: always; }
    }
  </style>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="theme-color" content="#c9a227">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ThorsMystery">
</head>
<body><h1 id="heading">Game codes</h1><p>Print these codes for your game.</p><button onclick="print()">Print</button><main id="codes" class="qr-grid">Loading…</main><script src="story-memory-reader.js"></script><script src="story-package.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="story-print.js"></script></body>
</html>
